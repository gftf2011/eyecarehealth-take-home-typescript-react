# FastMeals completo — banco, backend e painel com um comando (na raiz):
#   docker compose up --build
#
# Painel: http://localhost:3000 (admin@fastmeals.com / Admin@123).
# API:    http://localhost:3001/api · WebSocket: ws://localhost:3002/realtime
# AWS local (Floci, SNS/SQS): http://localhost:4566
# Observabilidade (Grafana com métricas, logs e traces): http://localhost:3300
#
# Os valores padrão abaixo são de DESENVOLVIMENTO LOCAL (segredos de exemplo,
# cookie sem Secure por ser HTTP). Para outro ambiente, defina as variáveis
# num .env nesta pasta (ver .env.example), que o Compose lê sozinho.
#
# Portável: nenhuma sub-rede ou IP fixo (a rede é a padrão do Compose) e,
# fora o painel, as portas só abrem em 127.0.0.1.

# Nome fixo: contêineres, rede e volume não dependem do nome da pasta.
name: fastmeals

# Uma imagem para todos os processos do backend. Só o `migrate` (o primeiro a
# subir) a constrói: vários serviços com `build` da mesma imagem fazem o
# BuildKit exportá-la em paralelo, e os exports colidem. Os demais só a usam
# (pull_policy: never — é uma imagem local, não está em registry).
x-backend: &backend
  image: fastmeals-backend:local
  pull_policy: never
  restart: unless-stopped
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-fastmeals}:${POSTGRES_PASSWORD:-fastmeals123}@postgres:5432/${POSTGRES_DB:-fastmeals}
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:-dev-only-access-secret-change-me-32-chars}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me-32-chars}

# Mensageria: SNS/SQS no Floci (emulador local da AWS). Para usar uma conta
# AWS de verdade, aponte AWS_ENDPOINT_URL para vazio e informe credenciais.
x-aws-env: &aws-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://floci:4566}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  EVENTS_TOPIC_NAME: ${EVENTS_TOPIC_NAME:-fastmeals-events.fifo}
  REALTIME_QUEUE_NAME: ${REALTIME_QUEUE_NAME:-fastmeals-realtime.fifo}
  REALTIME_DLQ_NAME: ${REALTIME_DLQ_NAME:-fastmeals-realtime-dlq.fifo}
  ORDERING_QUEUE_NAME: ${ORDERING_QUEUE_NAME:-fastmeals-ordering.fifo}
  ORDERING_DLQ_NAME: ${ORDERING_DLQ_NAME:-fastmeals-ordering-dlq.fifo}

# OpenTelemetry dos processos do backend: traces, métricas e logs por OTLP
# para o otel-lgtm (Collector + Prometheus + Loki + Tempo + Grafana). Para
# outro backend OTLP, troque OTEL_EXPORTER_OTLP_ENDPOINT; para desligar,
# OTEL_SDK_DISABLED=true.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fastmeals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastmeals123}
      POSTGRES_DB: ${POSTGRES_DB:-fastmeals}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Emulador local da AWS (só SNS e SQS são usados). Estado persistente no
  # volume: reiniciar o contêiner não perde filas nem mensagens.
  floci:
    image: floci/floci:2.1.0
    restart: unless-stopped
    environment:
      # URLs de fila com o nome do serviço, alcançáveis pelos outros contêineres.
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
    volumes:
      - floci-data:/app/data
    healthcheck:
      # A imagem não tem curl, wget nem grep: HTTP à mão pelo /dev/tcp do bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET /_floci/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Observabilidade local: OTel Collector (OTLP 4317/4318), Prometheus, Loki,
  # Tempo e Grafana numa imagem. Nada depende dele: se não estiver de pé, os
  # processos seguem funcionando e só deixam de exportar.
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
      # OTLP exposto só localmente: `npm run dev` fora do Docker também exporta.
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/fastmeals.yaml:ro
      - ./observability/grafana/fastmeals-dashboard.json:/otel-lgtm/fastmeals-dashboard.json:ro

  # Job de pré-deploy: cria tópico SNS, fila do tempo real, fila morta e a
  # assinatura entre eles (pode rodar de novo sem efeito) e sai.
  messaging-setup:
    <<: *backend
    restart: "no"
    command: ["node", "dist/messaging-setup.js"]
    environment:
      <<: [*backend-env, *aws-env]
      REALTIME_MAX_RECEIVE_COUNT: ${REALTIME_MAX_RECEIVE_COUNT:-5}
      REALTIME_VISIBILITY_TIMEOUT_SECONDS: ${REALTIME_VISIBILITY_TIMEOUT_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      floci:
        condition: service_healthy

  # Job de pré-deploy: aplica as migrations uma vez e sai (nunca no boot da API,
  # para réplicas não migrarem ao mesmo tempo). Também constrói a imagem.
  migrate:
    <<: *backend
    build:
      # Contexto na raiz: a imagem também leva seed/data.json. O que entra no
      # contexto é filtrado por backend/Dockerfile.dockerignore (lista permitida).
      context: .
      dockerfile: backend/Dockerfile
    pull_policy: build
    restart: "no"
    command: ["node", "dist/migrate.js", "latest"]
    depends_on:
      postgres:
        condition: service_healthy

  # Popula com seed/data.json. Idempotente: com dados presentes, não faz nada.
  seed:
    <<: *backend
    restart: "no"
    command: ["node", "dist/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    command: ["node", "--import", "./dist/instrumentation.js", "dist/server.js"]
    environment:
      <<: [*backend-env, *otel-env]
      OTEL_SERVICE_NAME: fastmeals-api
      PORT: "3001"
      # HTTP em localhost: em produção (HTTPS) deixe o padrão (Secure).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Um salto de proxy confiável: o nginx do painel, que acrescenta o IP
      # real ao X-Forwarded-For (o rate limit por IP vê o cliente real; um
      # valor forjado pelo cliente fica à esquerda e é ignorado). A porta da
      # API só abre em 127.0.0.1, então ninguém na rede fala direto com ela.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      # Otimizador de atribuição: problemas grandes rodam num pool de workers
      # (a API continua respondendo durante o cálculo); ver backend/README.md.
      OPTIMIZER_MAX_QUEUED: ${OPTIMIZER_MAX_QUEUED:-4}
      OPTIMIZER_TIMEOUT_MS: ${OPTIMIZER_TIMEOUT_MS:-10000}
      OPTIMIZER_INLINE_MAX_CELLS: ${OPTIMIZER_INLINE_MAX_CELLS:-10000}
      # Swagger UI em /api/docs (e o OpenAPI em /api/docs/json). Em produção,
      # API_DOCS_ENABLED=false tira os dois do ar.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  outbox-relay:
    <<: *backend
    command: ["node", "--import", "./dist/instrumentation.js", "dist/outbox-relay.js"]
    environment:
      <<: [*backend-env, *aws-env, *otel-env]
      OTEL_SERVICE_NAME: fastmeals-outbox-relay
      # O Floci usa a conta 000000000000; na AWS, o ARN do tópico real.
      EVENTS_TOPIC_ARN: ${EVENTS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:fastmeals-events.fifo}
      RELAY_HEALTH_PORT: "3003"
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
    depends_on:
      messaging-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  realtime:
    <<: *backend
    command: ["node", "--import", "./dist/instrumentation.js", "dist/realtime-gateway.js"]
    environment:
      <<: [*backend-env, *aws-env, *otel-env]
      OTEL_SERVICE_NAME: fastmeals-realtime
      REALTIME_PORT: "3002"
      # O navegador abre o WebSocket a partir da origem do painel (acompanha
      # FRONTEND_PORT, se a 3000 estiver ocupada na máquina).
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}}
    ports:
      - "127.0.0.1:${REALTIME_PORT:-3002}:3002"
    depends_on:
      redis:
        condition: service_healthy
      messaging-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Consumidores de eventos dos contextos, cada um com a própria fila: hoje,
  # o Ordering tira dos pedidos o entregador desativado ou removido.
  event-consumers:
    <<: *backend
    command: ["node", "--import", "./dist/instrumentation.js", "dist/event-consumers.js"]
    environment:
      <<: [*backend-env, *aws-env, *otel-env]
      OTEL_SERVICE_NAME: fastmeals-event-consumers
      EVENT_CONSUMERS_HEALTH_PORT: "3004"
    depends_on:
      messaging-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Painel: build estático servido por nginx, que faz o proxy de /api e
  # /realtime para o backend na mesma origem (ver frontend/nginx/).
  frontend:
    build:
      context: frontend
    image: fastmeals-frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
      # Sem o relay, as mudanças ficam no outbox e o painel não recebe nada em tempo real.
      outbox-relay:
        condition: service_healthy
      # Sem eles, um entregador desativado continua atribuído aos pedidos prontos.
      event-consumers:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  floci-data:
