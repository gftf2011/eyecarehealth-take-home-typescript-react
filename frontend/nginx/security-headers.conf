# Cabeçalhos de segurança, incluídos em cada location (um add_header dentro
# de um location descarta os do nível de cima, por isso o snippet).
#
# CSP: tudo da própria origem (incluindo a API e o WebSocket, via proxy);
# imagens de produtos podem vir de URLs https externas; estilos inline são
# usados por atributos style do React e pelos gráficos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
